name: Build & Release Firmware

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the pre-release (e.g. v0.1.0-alpha.1)'
        required: false
        default: 'v0.1.0-alpha.1'

permissions:
  contents: write

jobs:
  test:
    name: Native Regression Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile and Run Native Test Runner
        run: |
          mkdir -p build
          g++ -std=c++17 -w \
            -I test \
            -I src \
            -I src/ro_mesh \
            -I lib/MeshCore/src \
            test/test_all.cpp \
            test/mock_region_map.cpp \
            src/ro_mesh/regions/AutoRegionsRO.cpp \
            src/ro_mesh/hal/AdaptiveTier.cpp \
            src/ro_mesh/hal/PaGainLimiter.cpp \
            src/ro_mesh/filter/QuarantineEngine.cpp \
            src/ro_mesh/filter/BatteryGate.cpp \
            src/ro_mesh/filter/PacketFilter.cpp \
            src/ro_mesh/switcher/PresetCutover.cpp \
            src/ro_mesh/switcher/EmergencyProfileSwitcher.cpp \
            src/ro_mesh/advert/DeterministicAdverts.cpp \
            src/ro_mesh/companion/T1000eSos.cpp \
            src/ro_mesh/companion/ChannelCli.cpp \
            src/ro_mesh/companion/TelemetryBeacon.cpp \
            src/ro_mesh/companion/MessageStore.cpp \
            -o build/test_runner
          ./build/test_runner

  build:
    name: Build Target (${{ matrix.environment }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - t1000e_companion
          - heltec_v3_repeater
          - rak_1w_repeater
          - tbeam_1w_repeater
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware (${{ matrix.environment }})
        run: |
          pio run -e ${{ matrix.environment }}

      - name: Archive Built Binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
            .pio/build/${{ matrix.environment }}/*.hex
            .pio/build/${{ matrix.environment }}/*.uf2

  prerelease:
    name: Publish GitHub Pre-Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Package Release Assets
        id: pkg
        run: |
          mkdir -p dist
          find release-binaries -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} dist/ \;
          ls -la dist/

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v0.1.0-alpha.$(date +%Y%m%d%H%M)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "RO-mesh Core Firmware ${{ steps.pkg.outputs.tag }} (Pre-Release)"
          prerelease: true
          draft: false
          files: dist/*
          generate_release_notes: true
