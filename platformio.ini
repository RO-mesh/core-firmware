; ====================================================================
; RO-mesh Firmware Configuration
; Decoupled Architecture based on MeshCore
; Target Scope: #ro (Romania)
; ====================================================================

[platformio]
default_envs = t1000e_companion, heltec_v3_repeater, rak_1w_repeater, tbeam_1w_repeater
extra_configs =
  lib/MeshCore/variants/*/platformio.ini

[ro_mesh_base]
framework = arduino
monitor_speed = 115200
build_flags = 
  -w
  -D NDEBUG
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D RO_MESH_FIRMWARE=1
  -I src
  -I src/ro_mesh
  -I lib/MeshCore/src
  -I lib/MeshCore/src/helpers

; --------------------------------------------------------------------
; Target: Seeed SenseCAP T1000-E Companion
; --------------------------------------------------------------------
[env:t1000e_companion]
extends = t1000-e
board_build.ldscript = lib/MeshCore/boards/nrf52840_s140_v7_extrafs.ld
build_flags =
  ${t1000-e.build_flags}
  ${ro_mesh_base.build_flags}
  -D RO_MESH_COMPANION=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37
  -D ADVERT_NAME='"RO-mesh T1000-E"'
build_src_filter =
  +<ro_mesh/**>
  +<companion/main.cpp>
  +<../lib/MeshCore/src/helpers/ui/buzzer.cpp>
  +<../lib/MeshCore/src/helpers/nrf52/T1000eBoard.cpp>
  +<../lib/MeshCore/variants/t1000-e/*.cpp>

; --------------------------------------------------------------------
; Target: Heltec LoRa32 V3 Repeater
; --------------------------------------------------------------------
[env:heltec_v3_repeater]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${ro_mesh_base.build_flags}
  -D RO_MESH_REPEATER=1
  -D RO_MESH_AUTOREGIONS_RO=1
  -D ADVERT_NAME='"RO-mesh Heltec V3"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  +<ro_mesh/**>
  +<repeater/main.cpp>
  +<../lib/MeshCore/variants/heltec_v3/*.cpp>

; --------------------------------------------------------------------
; Target: RAK 1W High-Power Repeater (RAK4631 + PA)
; --------------------------------------------------------------------
[env:rak_1w_repeater]
extends = rak4631
build_flags =
  ${rak4631.build_flags}
  ${ro_mesh_base.build_flags}
  -D RO_MESH_REPEATER=1
  -D RO_MESH_AUTOREGIONS_RO=1
  -D PA_GAIN_DB=14
  -D ADVERT_NAME='"RO-mesh RAK 1W"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  +<ro_mesh/**>
  +<repeater/main.cpp>
  +<../lib/MeshCore/variants/rak4631/*.cpp>

; --------------------------------------------------------------------
; Target: LilyGo T-Beam 1W High-Power Repeater
; --------------------------------------------------------------------
[env:tbeam_1w_repeater]
extends = LilyGo_TBeam_1W
build_flags =
  ${LilyGo_TBeam_1W.build_flags}
  ${ro_mesh_base.build_flags}
  -D RO_MESH_REPEATER=1
  -D RO_MESH_AUTOREGIONS_RO=1
  -D PA_GAIN_DB=14
  -D ADVERT_NAME='"RO-mesh T-Beam 1W"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  +<ro_mesh/**>
  +<repeater/main.cpp>
  +<../lib/MeshCore/variants/lilygo_tbeam_1w/*.cpp>

; --------------------------------------------------------------------
; Target: Desktop Native Unit Tests
; --------------------------------------------------------------------
[env:native_test]
platform = native
build_flags =
  -std=c++17
  -D TESTING
  -D NDEBUG
  -I src
  -I src/ro_mesh

