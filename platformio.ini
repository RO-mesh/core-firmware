; ====================================================================
; RO-mesh Firmware Configuration
; Decoupled Architecture based on MeshCore
; Target Scope: #ro (Romania)
; ====================================================================

[platformio]
default_envs = t1000e_companion, t1000e_repeater, heltec_v3_repeater, rak_1w_repeater, tbeam_1w_repeater
boards_dir = lib/MeshCore/boards
extra_configs =
  lib/MeshCore/platformio.ini
  lib/MeshCore/variants/*/platformio.ini
  targets.ini

[ro_mesh_base]
framework = arduino
monitor_speed = 115200
lib_ignore = MeshCore
build_flags = 
  -w
  -D NDEBUG
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D RO_MESH_FIRMWARE=1
  -I src
  -I src/ro_mesh
  -I lib/MeshCore/src
  -I lib/MeshCore/src/helpers
  -I lib/MeshCore/src/helpers/ui
  -I lib/MeshCore/lib/ed25519
  -I lib/MeshCore/examples/companion_radio
