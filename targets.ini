; --------------------------------------------------------------------
; Target: Desktop Native Unit Tests
; --------------------------------------------------------------------
[env:native_test]
platform = native
build_flags =
  -std=c++17
  -D TESTING
  -D NDEBUG
  -I src
  -I src/ro_mesh

