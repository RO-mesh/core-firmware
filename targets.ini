; ====================================================================
; RO-mesh Firmware Targets
; Concrete board implementations overriding MeshCore defaults
; ====================================================================

; --------------------------------------------------------------------
; Target: Seeed SenseCAP T1000-E Companion
; --------------------------------------------------------------------
[env:t1000e_companion]
extends = t1000-e
board_build.ldscript = lib/MeshCore/boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${t1000-e.build_flags}
  ${ro_mesh_base.build_flags}
  -I lib/MeshCore/examples/companion_radio
  -I lib/MeshCore/examples/companion_radio/ui-orig
  -I lib/MeshCore/src/helpers/ui
  -I lib/MeshCore/src/helpers/nrf52
  -I lib/MeshCore/variants/t1000-e
  -D PIN_GPS_TX=PIN_SERIAL1_TX
  -D PIN_GPS_RX=PIN_SERIAL1_RX
  -D RO_MESH_COMPANION=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37
  -D ADVERT_NAME='"RO-mesh T1000-E"'
build_src_filter =
  +<ro_mesh/**>
  +<companion/main.cpp>
  +<../lib/MeshCore/src/*.cpp>
  +<../lib/MeshCore/lib/ed25519/*.c>
  +<../lib/MeshCore/src/helpers/*.cpp>
  +<../lib/MeshCore/src/helpers/ui/buzzer.cpp>
  +<../lib/MeshCore/src/helpers/ui/NullDisplayDriver.cpp>
  +<../lib/MeshCore/src/helpers/nrf52/T1000eBoard.cpp>
  +<../lib/MeshCore/src/helpers/nrf52/SerialBLEInterface.cpp>
  +<../variants/t1000-e/*.cpp>
  +<../lib/MeshCore/examples/companion_radio/DataStore.cpp>
  +<../lib/MeshCore/examples/companion_radio/MyMesh.cpp>
  +<../lib/MeshCore/examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

; --------------------------------------------------------------------
; Target: Seeed SenseCAP T1000-E Repeater (Airborne / Drone / Balloon)
; --------------------------------------------------------------------
[env:t1000e_repeater]
extends = t1000-e
board_build.ldscript = lib/MeshCore/boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${t1000-e.build_flags}
  ${ro_mesh_base.build_flags}
  -I lib/MeshCore/examples/simple_repeater
  -I lib/MeshCore/examples/companion_radio/ui-orig
  -I lib/MeshCore/src/helpers/ui
  -I lib/MeshCore/src/helpers/nrf52
  -I lib/MeshCore/variants/t1000-e
  -D PIN_GPS_TX=PIN_SERIAL1_TX
  -D PIN_GPS_RX=PIN_SERIAL1_RX
  -D RO_MESH_REPEATER=1
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37
  -D ADVERT_NAME='"RO-mesh T1000-E Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  +<ro_mesh/**>
  +<repeater/main.cpp>
  +<../lib/MeshCore/src/*.cpp>
  +<../lib/MeshCore/lib/ed25519/*.c>
  +<../lib/MeshCore/src/helpers/*.cpp>
  +<../lib/MeshCore/src/helpers/ui/buzzer.cpp>
  +<../lib/MeshCore/src/helpers/ui/NullDisplayDriver.cpp>
  +<../lib/MeshCore/src/helpers/nrf52/T1000eBoard.cpp>
  +<../variants/t1000-e/*.cpp>
  +<../lib/MeshCore/examples/simple_repeater/MyMesh.cpp>
lib_deps =
  ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

