  -D RO_MESH_REPEATER=1
  -D RO_MESH_AUTOREGIONS_RO=1
  -D PA_GAIN_DB=14
  -D ADVERT_NAME='"RO-mesh RAK 1W"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  +<ro_mesh/**>
  +<repeater/main.cpp>
  +<../lib/MeshCore/src/*.cpp>
  +<../lib/MeshCore/lib/ed25519/*.c>
  +<../lib/MeshCore/src/helpers/*.cpp>
  +<../lib/MeshCore/src/helpers/ui/SSD1306Display.cpp>
  +<../lib/MeshCore/src/helpers/ui/MomentaryButton.cpp>
  +<../variants/rak4631/*.cpp>
  +<../lib/MeshCore/examples/simple_repeater/MyMesh.cpp>
  +<../lib/MeshCore/examples/simple_repeater/UITask.cpp>

